<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syntax</title>
    <link rel="stylesheet" href="style.css">
    <style>
        h3{
            color: blue;
            font-size: 100px;
            background-color: aqua;
        }
        b{
            font-style: oblique;
            font-size: 50px;
        }
    </style>
</head>
<body>
    <!-- CSS - cascading Style Sheet, it is use to modify our web pages depending on our taste
     CSS Syntax - This tells us how CSS looks like
     Three major ways by which CSS can be incorporated in HTML
     1. Inline styling
     2. Internal styling
     External styling -->

     <h2 style="color: blue; font-size: 100px;">Welcome to CSS Class</h2>
     <h3>Welcome to CSS Class</h1>
     <b>CSS is more interesting</b>
     <h1>Welcome to CSS Class</h1>
</body>
</html>
